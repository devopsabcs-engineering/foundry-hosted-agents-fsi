{%- assign is_fr_page = false -%}
{%- if page.lang == 'fr' or page.url contains '/fr/' -%}
  {%- assign is_fr_page = true -%}
{%- endif -%}
{%- assign fr_href = "/fr" | relative_url -%}
{%- assign fr_href_prefix = fr_href | append: "/" -%}
<style>
  /* Left nav is built once for the whole site; hide the other language's links per page.
     Matched against site.baseurl-prefixed hrefs so this still works whether Pages is
     root-served (private repo) or served under /<repo-name>/ (public repo). */
  {%- if is_fr_page %}
  #site-nav .nav-list-item:has(> a.nav-list-link[href]:not([href="{{ fr_href }}"]):not([href^="{{ fr_href_prefix }}"])) { display: none; }
  {%- else %}
  #site-nav .nav-list-item:has(> a.nav-list-link:is([href="{{ fr_href }}"], [href^="{{ fr_href_prefix }}"])) { display: none; }
  {%- endif %}
  .nav-list-item.lang-hidden { display: none !important; }

  /* Site title is long; shrink it so it wraps to 2 lines instead of 3 in the sidebar. */
  .site-title {
    font-size: 1.15rem;
    line-height: 1.3;
    padding-top: 0.75rem;
    padding-bottom: 0.75rem;
  }

  /* Just the Docs pins the sidebar header to a fixed height at desktop widths, which
     clips a title that needs more than one line. Let it grow instead; the nav below it
     is `flex: 1 1 auto`, so it reclaims whatever space is left. */
  .site-header {
    height: auto;
    max-height: none;
  }

  .site-title {
    height: auto;
  }
</style>
<script>
  // Fallback for browsers without CSS :has() support.
  document.addEventListener('DOMContentLoaded', function () {
    var isFrPage = {{ is_fr_page }};
    var frHref = {{ fr_href | jsonify }};
    var frHrefPrefix = {{ fr_href_prefix | jsonify }};
    document.querySelectorAll('#site-nav .nav-list-item').forEach(function (item) {
      var link = item.querySelector('a.nav-list-link');
      if (!link || !link.hasAttribute('href')) return;
      var href = link.getAttribute('href') || '';
      var isFrLink = href === frHref || href.indexOf(frHrefPrefix) === 0;
      if (isFrPage !== isFrLink) item.classList.add('lang-hidden');
    });
  });
</script>
