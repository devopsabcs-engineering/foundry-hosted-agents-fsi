name: Deploy and Evaluate (Staging -> Production)

# ============================================================================
# DEPLOYS TO A REAL AZURE SUBSCRIPTION.
# This workflow runs `az deployment group create`, `azd provision`, and
# `azd deploy` against the shared resource group. Staging is deployed and
# evaluated first; promotion to production is gated by the required reviewers
# configured on the `production` GitHub Environment.
# ============================================================================
#
# Shared by hosted-agent-cd.yml's manual dispatch entry point. Adapted from
# the sibling `foundry-hosted-agents` repository's lint -> Bicep
# validate/what-if -> deploy-staging -> evaluate -> manual-approval ->
# promote flow (Implementation Phase 11, Step 11.2). This repository's
# deterministic evaluation suite (eval/evaluation_gate.py) re-runs against
# the exact code that was just packaged and deployed, so a regression
# introduced between the lint stage and this point still blocks promotion.
#
# The "evaluate" job also runs a real LLM-judge step
# (eval/run_judge_evaluation.py, eval/judge-dataset.jsonl) against the
# live-deployed quote-preparation-agent endpoint (src/quote-preparation-agent's
# response_bridge.py bridges the Foundry Responses protocol to this
# project's graph). Coherence/groundedness/task_adherence scores from a
# generic LLM judge are expected to be low for this agent by design -- it
# always responds with a bounded, templated, bilingual status message and
# never auto-approves or reveals an amount (see graph.py's
# AGENT_TASK_INSTRUCTIONS and _STATUS_TEMPLATES) -- so this step's evidence
# is retained for trend visibility rather than gating production promotion
# on a 100% judge pass rate.

on:
  workflow_call:
    inputs:
      golden_dataset_path:
        type: string
        required: false
        default: eval/golden-dataset.jsonl
  workflow_dispatch:
    inputs:
      golden_dataset_path:
        description: "Path to the golden dataset used for the evaluation gate"
        required: false
        default: eval/golden-dataset.jsonl

# Secretless OIDC federation (no stored client secrets) for every job that
# talks to Azure, mirroring the sibling repository's proven pattern.
permissions:
  id-token: write
  contents: read

concurrency:
  group: desjardins-quote-preparation-shared-environments
  queue: max

env:
  AGENT_PROJECT_DIR: .
  AGENT_NAME: quote-preparation-agent
  GOLDEN_DATASET_PATH: ${{ inputs.golden_dataset_path || 'eval/golden-dataset.jsonl' }}
  STAGING_AZD_ENV_NAME: desjardins-quote-preparation-staging
  PRODUCTION_AZD_ENV_NAME: desjardins-quote-preparation-poc

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: Lint and offline unit tests (re-run here so this workflow is
  # self-contained when dispatched directly, without depending on a prior
  # continuous-validation.yml run).
  # ---------------------------------------------------------------------
  lint:
    name: Lint and offline unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # RI-02 / WI-01. Gates the reviewer `az acr build` further down this
      # workflow: apps/reviewer-app/Dockerfile vendors the agent copy of
      # approval_repository.py, so a divergence here ships into the image.
      - name: Assert the vendored approval_repository copies are byte-identical
        run: |
          set -euo pipefail
          AGENT=src/quote-preparation-agent/approval_repository.py
          WORKSHOP=apps/workshop/approval_repository.py
          if ! cmp -s "$AGENT" "$WORKSHOP"; then
            echo "::error file=$AGENT::$AGENT and $WORKSHOP have diverged. They are vendored copies of one another and must stay byte-identical; update both or neither."
            diff -u "$WORKSHOP" "$AGENT" || true
            exit 1
          fi
          echo "Vendored copies are identical (sha256 $(sha256sum "$AGENT" | cut -d' ' -f1))."

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r mcp/application-server/requirements.txt \
            -r mcp/rulebook-server/requirements.txt \
            -r src/quote-preparation-agent/requirements.txt

      - name: Agent graph unit tests
        run: |
          mkdir -p offline-evidence
          pytest src/quote-preparation-agent/tests -v --junitxml=offline-evidence/agent.xml

      - name: Deterministic evaluation checks
        run: |
          pytest eval -v --junitxml=offline-evidence/deterministic.xml

      - name: Reporting and contract tests
        run: |
          pytest apps/workshop/tests mcp/application-server/tests mcp/rulebook-server/tests \
            -v --junitxml=offline-evidence/reporting.xml

      - name: Deterministic evaluation gate (golden dataset)
        run: python eval/evaluation_gate.py

      - name: Retain offline test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-test-evidence-${{ github.run_attempt }}
          path: offline-evidence/*.xml
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Stage 2: Bicep validate and what-if (staging resource group)
  # ---------------------------------------------------------------------
  bicep-validate:
    name: Bicep validate and what-if
    needs: [lint]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: az bicep build (full module graph)
        run: az bicep build --file infra/main.bicep

      # Runs before every what-if and provision because main.bicep resolves the
      # VNet, its subnets, and the Cosmos private DNS zone with `existing`, which
      # fails outright when they are absent. It is a separate deployment rather
      # than part of main.bicep because main.bicep is applied once per
      # environment into one shared resource group, and an ARM write of a VNet
      # that omits `subnets` deletes the subnets belonging to the other
      # environment. Idempotent, so both jobs can run it.
      - name: Deploy shared network foundation (idempotent)
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name network-foundation \
            --template-file infra/network.bicep \
            --parameters location="$AZURE_LOCATION" \
            --output none
          echo "Shared network foundation is in place."

      - name: az deployment group what-if (staging resource group; preview only, no apply)
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          MCP_ACR_NAME: ${{ vars.MCP_ACR_NAME }}
          APPLICATION_MCP_IMAGE: ${{ vars.APPLICATION_MCP_IMAGE }}
          RULEBOOK_MCP_IMAGE: ${{ vars.RULEBOOK_MCP_IMAGE }}
          REVIEWER_APP_IMAGE: ${{ vars.REVIEWER_APP_IMAGE }}
          REVIEWER_CLIENT_ID: ${{ vars.REVIEWER_CLIENT_ID }}
          AGENT_PRINCIPAL_ID: ${{ vars.AGENT_PRINCIPAL_ID }}
        run: |
          set -euo pipefail
          # Every reviewer parameter below has a main.bicep default, so this list stays
          # valid while the repository variables are unset. An empty reviewerClientId
          # skips the reviewer app and its Cosmos grant; an empty agentPrincipalId skips
          # the agent's Cosmos grant. reviewerAppImage is the one that must never be
          # passed empty, so it falls back to the same placeholder main.bicep defaults to.
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --no-pretty-print \
            --parameters environmentName="$STAGING_AZD_ENV_NAME" location="$AZURE_LOCATION" \
              mcpAcrName="$MCP_ACR_NAME" applicationMcpImage="$APPLICATION_MCP_IMAGE" \
              rulebookMcpImage="$RULEBOOK_MCP_IMAGE" \
              reviewerAppImage="${REVIEWER_APP_IMAGE:-mcr.microsoft.com/k8se/quickstart:latest}" \
              reviewerClientId="$REVIEWER_CLIENT_ID" \
              agentPrincipalId="$AGENT_PRINCIPAL_ID" \
            > whatif-candidate.json
          python3 -c "import json,sys;d=json.load(open('whatif-candidate.json'));print(json.dumps(d['changes'],indent=2)[:20000])"

      - name: Assert redeployment is idempotent (no Delete on deployed resources)
        run: python3 scripts/assert_bicep_idempotent.py --candidate whatif-candidate.json

  # ---------------------------------------------------------------------
  # Stage 3: Deploy candidate to staging (MCP services and hosted agent)
  # ---------------------------------------------------------------------
  deploy-staging:
    name: Deploy candidate to staging
    needs: [bicep-validate]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      agent_version: ${{ steps.deploy.outputs.agent_version }}
      project_endpoint: ${{ steps.deploy.outputs.project_endpoint }}
      application_mcp_image: ${{ steps.build-mcp.outputs.application_mcp_image }}
      rulebook_mcp_image: ${{ steps.build-mcp.outputs.rulebook_mcp_image }}
      reviewer_app_image: ${{ steps.build-reviewer.outputs.reviewer_app_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd extensions (auto-install is disabled in CI)
        run: |
          azd extension install azure.ai.agents --source azd
          azd extension install azure.ai.connections --source azd

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Configure staging deployment environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd env select "$STAGING_AZD_ENV_NAME" || azd env new "$STAGING_AZD_ENV_NAME" --no-prompt

          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}"
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}"
          azd env set MCP_ACR_NAME "${{ vars.MCP_ACR_NAME }}"
          # Both may legitimately be empty: main.bicep skips the reviewer module
          # when reviewerClientId is empty and skips the agent's Cosmos grant
          # when agentPrincipalId is empty. See the agent-identity step below.
          azd env set REVIEWER_CLIENT_ID "${{ vars.REVIEWER_CLIENT_ID }}"
          azd env set AGENT_PRINCIPAL_ID "${{ vars.AGENT_PRINCIPAL_ID }}"

      - name: Build immutable staging MCP images
        id: build-mcp
        env:
          MCP_ACR_NAME: ${{ vars.MCP_ACR_NAME }}
        run: |
          set -euo pipefail
          REGISTRY=$(az acr show --name "$MCP_ACR_NAME" --query loginServer -o tsv)
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for SERVER in application rulebook; do
            IMAGE="staging/${SERVER}-mcp:${TAG}"
            az acr build --registry "$MCP_ACR_NAME" --image "$IMAGE" --file "mcp/${SERVER}-server/Dockerfile" .
            DIGEST=$(az acr repository show --name "$MCP_ACR_NAME" --image "$IMAGE" --query digest -o tsv)
            [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Invalid image digest"; exit 1; }
            azd env set "${SERVER^^}_MCP_IMAGE" "${REGISTRY}/staging/${SERVER}-mcp@${DIGEST}"
            echo "${SERVER}_mcp_image=${REGISTRY}/staging/${SERVER}-mcp@${DIGEST}" >> "$GITHUB_OUTPUT"
          done

      # WI-12. Same remote-build/digest-pin contract as the MCP images above.
      # The build context is the repository root because
      # apps/reviewer-app/Dockerfile copies the case-store modules out of
      # src/quote-preparation-agent rather than vendoring a third copy.
      - name: Build immutable staging reviewer image
        id: build-reviewer
        env:
          MCP_ACR_NAME: ${{ vars.MCP_ACR_NAME }}
        run: |
          set -euo pipefail
          REGISTRY=$(az acr show --name "$MCP_ACR_NAME" --query loginServer -o tsv)
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="staging/reviewer-app:${TAG}"
          az acr build --registry "$MCP_ACR_NAME" --image "$IMAGE" --file apps/reviewer-app/Dockerfile .
          DIGEST=$(az acr repository show --name "$MCP_ACR_NAME" --image "$IMAGE" --query digest -o tsv)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Invalid reviewer image digest"; exit 1; }
          azd env set REVIEWER_APP_IMAGE "${REGISTRY}/staging/reviewer-app@${DIGEST}"
          echo "reviewer_app_image=${REGISTRY}/staging/reviewer-app@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Provision staging infrastructure (idempotent)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3; do
            azd provision --no-prompt && exit 0
            [[ "$ATTEMPT" -lt 3 ]] || { echo "::error::azd provision failed after 3 attempts"; exit 1; }
            echo "::warning::azd provision failed (attempt $ATTEMPT/3); a prior ARM operation may still be settling -- retrying in 60s"
            sleep 60
          done

      - name: Deploy candidate to staging
        id: deploy
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd deploy --no-prompt
          PROJECT_ENDPOINT=$(azd env get-values --output json | jq -er '.FOUNDRY_PROJECT_ENDPOINT')
          echo "project_endpoint=$PROJECT_ENDPOINT" >> "$GITHUB_OUTPUT"
          azd ai agent show "$AGENT_NAME" --output json > /tmp/agent-show.json
          AGENT_VERSION=$(jq -er '.version | select(type == "string" and test("^[0-9]+$"))' /tmp/agent-show.json)
          jq -e '.status == "active"' /tmp/agent-show.json
          echo "Deployed candidate version: $AGENT_VERSION"
          echo "agent_version=$AGENT_VERSION" >> "$GITHUB_OUTPUT"

      # WI-10. Foundry creates the hosted agent's dedicated Entra agent identity
      # during `azd deploy`, after `azd provision` has already run, so
      # main.bicep's agentPrincipalId cannot be resolved in-template and the
      # agent's Cosmos data-plane grant is skipped until it is supplied.
      #
      # Microsoft's guidance is to read the agent identity off the Foundry
      # project's ARM JSON view and use it as the assignee
      # (learn.microsoft.com/azure/foundry/agents/concepts/agent-identity --
      # "Shared project identity" and "Assign permissions to the agent
      # identity"). No `azd`/`az` command is documented to print the identifier
      # on its own, so this step publishes the project JSON verbatim rather than
      # guessing at a property path, and never fails the deployment.
      #
      # An operator reads `agentIdentityId` out of the artifact once and sets it
      # as the `AGENT_PRINCIPAL_ID` repository variable; the next run's
      # `azd provision` then applies the grant. It is deliberately NOT parsed
      # and auto-applied here: grabbing the wrong GUID (for example the
      # project's managed-identity principalId) would grant Cosmos write access
      # to the wrong principal and still leave the agent unable to write.
      - name: Capture the Foundry project identity JSON (agent identity lookup)
        if: always() && steps.deploy.outcome == 'success'
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        env:
          CONFIGURED_AGENT_PRINCIPAL_ID: ${{ vars.AGENT_PRINCIPAL_ID }}
        run: |
          set -uo pipefail
          mkdir -p agent-identity
          PROJECT_ID=$(azd env get-values --output json | jq -r '.AZURE_AI_PROJECT_ID // empty')
          if [ -n "$PROJECT_ID" ]; then
            az resource show --ids "$PROJECT_ID" -o json > agent-identity/foundry-project.json || true
          fi
          # The grant in modules/cosmos-rbac.bicep targets the agent's own identity,
          # which Foundry creates when the agent is deployed. Deleting and recreating
          # the Foundry account mints a new one, leaving the configured variable
          # pointing at a principal that no longer exists and the agent unable to
          # write cases. Read the live value so a mismatch is visible on the run
          # that caused it rather than on the first failed write.
          PROJECT_ENDPOINT=$(azd env get-values --output json | jq -r '.AZURE_AI_PROJECT_ENDPOINT // empty')
          LIVE_AGENT_PRINCIPAL_ID=""
          if [ -n "$PROJECT_ENDPOINT" ]; then
            TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken --output tsv 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then
              curl -sS -H "Authorization: Bearer $TOKEN" "${PROJECT_ENDPOINT}/agents?api-version=v1" \
                > agent-identity/agents.json || true
              LIVE_AGENT_PRINCIPAL_ID=$(jq -r \
                '[.data[]?.versions.latest.instance_identity.principal_id] | map(select(. != null)) | first // empty' \
                agent-identity/agents.json 2>/dev/null || true)
            fi
          fi
          {
            echo '## Hosted agent identity (WI-10)'
            echo ''
            if [ -n "$LIVE_AGENT_PRINCIPAL_ID" ]; then
              echo "Live agent principal ID: \`$LIVE_AGENT_PRINCIPAL_ID\`"
              echo ''
              # The agents API can report an identity that was never registered in
              # Entra, or one left over from a deleted account. Granting Cosmos
              # data-plane access to it fails the whole deployment with a BadRequest
              # that azd reports as a name conflict, so check before recommending it.
              if ! az ad sp show --id "$LIVE_AGENT_PRINCIPAL_ID" --output none 2>/dev/null; then
                echo "::warning::The live agent principal \`$LIVE_AGENT_PRINCIPAL_ID\` does not resolve in Entra. Setting it as AGENT_PRINCIPAL_ID will fail the next provision with a BadRequest on the Cosmos role assignment."
                echo '**This principal does not resolve in Entra**, so it cannot receive a Cosmos'
                echo 'data-plane grant. Leave `AGENT_PRINCIPAL_ID` unset until it resolves;'
                echo 'the agent serves requests but cannot write cases in the meantime.'
                LIVE_AGENT_PRINCIPAL_ID=""
              fi
            fi
            if [ -z "${CONFIGURED_AGENT_PRINCIPAL_ID:-}" ]; then
              echo 'The `AGENT_PRINCIPAL_ID` environment variable is **not set**, so the hosted'
              echo 'agent has no Cosmos data-plane grant and cannot write cases.'
              echo ''
              echo 'To fix: set the live principal ID above as the `AGENT_PRINCIPAL_ID`'
              echo 'environment variable. The next run applies the grant with no template change.'
            elif [ -n "$LIVE_AGENT_PRINCIPAL_ID" ] && [ "$LIVE_AGENT_PRINCIPAL_ID" != "$CONFIGURED_AGENT_PRINCIPAL_ID" ]; then
              echo "::warning::AGENT_PRINCIPAL_ID is \`$CONFIGURED_AGENT_PRINCIPAL_ID\` but the live agent identity is \`$LIVE_AGENT_PRINCIPAL_ID\`. The Cosmos grant was applied to the wrong principal and the agent cannot write cases. Update the environment variable and rerun."
              echo '**The configured `AGENT_PRINCIPAL_ID` does not match the live agent identity.**'
              echo ''
              echo "Configured: \`$CONFIGURED_AGENT_PRINCIPAL_ID\`"
              echo ''
              echo 'Foundry mints a new agent identity whenever the account is recreated, so this'
              echo 'is the expected state after a network rebuild. Update the environment variable'
              echo 'to the live value above and rerun to reapply the grant.'
            else
              echo 'The `AGENT_PRINCIPAL_ID` environment variable matches the live agent identity,'
              echo 'so `azd provision` applied the agent'"'"'s Cosmos data-plane grant on this run.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Foundry project identity JSON
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: agent-identity-staging
          path: agent-identity/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload azd environment state (for the evaluate job)
        uses: actions/upload-artifact@v6
        with:
          name: azd-env-staging
          path: ${{ github.workspace }}/.azure/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Deployed candidate summary
        if: always() && steps.deploy.outcome == 'success'
        env:
          AGENT_VERSION: ${{ steps.deploy.outputs.agent_version }}
          PROJECT_ENDPOINT: ${{ steps.deploy.outputs.project_endpoint }}
        run: |
          {
            echo '## Deployed Candidate'
            echo ''
            echo "Agent version: $AGENT_VERSION"
            echo "Project endpoint: $PROJECT_ENDPOINT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment links summary
        if: always() && steps.deploy.outcome == 'success'
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: python scripts/deployment_summary.py --out ${{ github.workspace }}/deployment-links.md

      # publish-test-trends.yml (triggered by workflow_run) has no azd/Azure
      # context of its own, so it cannot re-derive these links -- it
      # downloads this artifact instead of guessing or omitting them.
      - name: Upload deployment links for the wiki-publish job
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: deployment-links-staging
          path: deployment-links.md
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Stage 4: Deterministic evaluation gate + LLM-judge (release quality control)
  #
  # The deterministic gate re-validates the golden dataset against the
  # exact code that was just packaged and deployed, so a regression
  # introduced between the lint stage and this point still blocks
  # promotion. The LLM-judge step invokes the live-deployed staging
  # endpoint via eval/run_judge_evaluation.py; its evidence is retained for
  # trend visibility but does not gate `promote-production` on a 100%
  # judge pass rate (see the top-of-file comment on expected score shape).
  # ---------------------------------------------------------------------
  evaluate:
    name: LLM-judge + deterministic evaluation gate (release quality control)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r mcp/application-server/requirements.txt \
            -r mcp/rulebook-server/requirements.txt \
            -r src/quote-preparation-agent/requirements.txt

      - name: Deterministic evaluation gate (golden dataset)
        run: python eval/evaluation_gate.py

      - name: Deterministic evaluation gate summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("eval/results.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not path.exists():
              lines = [
                  "## Deterministic Evaluation Gate (Release)",
                  "",
                  "No eval/results.json was produced; inspect the gate step above.",
                  "",
              ]
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              records = report["records"]
              passed = sum(1 for record in records if record["passed"])
              lines = [
                  "## Deterministic Evaluation Gate (Release)",
                  "",
                  f"Dataset size: {report['dataset_size']}",
                  f"Passed records: {passed} / {len(records)}",
                  f"Bilingual parity: {report['bilingual_parity']['passed']}",
                  f"Gate result: {'PASSED' if report['passed'] else 'FAILED'}",
                  "",
              ]
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          PY

      - name: Install judge evaluation SDKs
        run: python -m pip install azure-ai-projects==2.6.0 openai==3.6.0 azure-identity==1.25.3

      - name: LLM-judge evaluation gate (advisory; evidence retained for trends, does not block promotion)
        id: judge
        continue-on-error: true
        env:
          PROJECT_ENDPOINT: ${{ needs.deploy-staging.outputs.project_endpoint }}
          AGENT_VERSION: ${{ needs.deploy-staging.outputs.agent_version }}
          JUDGE_DEPLOYMENT: gpt-4o-mini
        run: |
          python eval/convert_judge_dataset.py eval/judge-dataset.jsonl "$RUNNER_TEMP/judge-dataset.json" --locale en-CA
          python eval/run_judge_evaluation.py \
            --endpoint "$PROJECT_ENDPOINT" --agent quote-preparation-agent \
            --version "$AGENT_VERSION" --deployment "$JUDGE_DEPLOYMENT" \
            --dataset "$RUNNER_TEMP/judge-dataset.json" \
            --output-dir judge-evidence --minimum-pass-rate 1.0

      - name: Stage judge evidence alongside the deterministic gate result
        if: always()
        run: |
          mkdir -p evaluation-evidence
          cp -f eval/results.json evaluation-evidence/results.json || true
          if [ -f judge-evidence/results.json ]; then
            cp -f judge-evidence/results.json evaluation-evidence/judge-results.json
          fi

      - name: Judge evaluation summary
        if: always()
        run: |
          {
            echo '## LLM-Judge Evaluation (advisory)'
            echo ''
            if [ "${{ steps.judge.outcome }}" = "success" ]; then
              echo 'All judge metrics met the configured minimum pass rate.'
            elif [ -f judge-evidence/results.json ]; then
              echo 'One or more judge metrics did not meet the configured minimum pass rate.'
              echo 'This agent always returns a bounded, templated status message by design'
              echo '(never an amount, never auto-approved), which generic coherence/groundedness'
              echo 'rubrics tend to score low -- see the evidence artifact for per-record detail.'
              echo 'This step is advisory and does not block production promotion.'
            else
              echo 'Judge step did not produce evidence; inspect the step above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The judge is advisory about scores, not about reachability. No evidence
      # file means it never reached the agent, which is a deployment failure
      # that must not ride through to production as a green run.
      - name: Fail when the judge could not reach the staging agent
        if: always() && steps.judge.outcome == 'failure'
        run: |
          if [ ! -f judge-evidence/results.json ]; then
            echo "::error::The LLM-judge could not reach the staging agent, so no evidence was produced." \
              "A low judge score is advisory; an unreachable agent is not." \
              "Check that the agent endpoint responds at the staging project endpoint above."
            exit 1
          fi
          echo "Judge produced evidence; score misses remain advisory."

      - name: Retain evaluation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evaluation-evidence-${{ github.run_attempt }}
          path: evaluation-evidence/
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Stage 5: Manual production-approval gate, then promote
  #
  # No dedicated approval job is needed: gating on the `production` GitHub
  # Environment (with required reviewers configured in repository
  # settings) blocks this job from starting until a human approves it,
  # which *is* the "manual production approval" step from the plan.
  # ---------------------------------------------------------------------
  promote-production:
    name: Promote to production
    needs: [evaluate, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd extensions (auto-install is disabled in CI)
        run: |
          azd extension install azure.ai.agents --source azd
          azd extension install azure.ai.connections --source azd

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd authentication and select production environment
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        env:
          APPLICATION_MCP_IMAGE: ${{ needs.deploy-staging.outputs.application_mcp_image }}
          RULEBOOK_MCP_IMAGE: ${{ needs.deploy-staging.outputs.rulebook_mcp_image }}
          REVIEWER_APP_IMAGE: ${{ needs.deploy-staging.outputs.reviewer_app_image }}
          REVIEWER_CLIENT_ID: ${{ vars.REVIEWER_CLIENT_ID }}
          AGENT_PRINCIPAL_ID: ${{ vars.AGENT_PRINCIPAL_ID }}
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env select "$PRODUCTION_AZD_ENV_NAME" || azd env new "$PRODUCTION_AZD_ENV_NAME" --no-prompt

          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}"
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}"
          azd env set MCP_ACR_NAME "${{ vars.MCP_ACR_NAME }}"
          azd env set REVIEWER_CLIENT_ID "$REVIEWER_CLIENT_ID"
          azd env set AGENT_PRINCIPAL_ID "$AGENT_PRINCIPAL_ID"
          for SERVER in APPLICATION RULEBOOK; do
            IMAGE_KEY="${SERVER}_MCP_IMAGE"
            IMAGE="${!IMAGE_KEY}"
            [[ "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || { echo "::error::Missing evaluated MCP image digest"; exit 1; }
            azd env set "$IMAGE_KEY" "$IMAGE"
          done
          # Promote the exact reviewer digest staging evaluated; never rebuild.
          # Only enforced when the reviewer app is actually in scope for this
          # environment -- an unset REVIEWER_CLIENT_ID means main.bicep skips
          # the reviewer module entirely and the image parameter is unused.
          if [ -n "$REVIEWER_CLIENT_ID" ]; then
            [[ "$REVIEWER_APP_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || { echo "::error::Missing evaluated reviewer image digest"; exit 1; }
          fi
          if [ -n "$REVIEWER_APP_IMAGE" ]; then
            azd env set REVIEWER_APP_IMAGE "$REVIEWER_APP_IMAGE"
          fi

      - name: Deploy shared network foundation (idempotent)
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name network-foundation \
            --template-file infra/network.bicep \
            --parameters location="$AZURE_LOCATION" \
            --output none
          echo "Shared network foundation is in place."

      - name: Provision production infrastructure (idempotent)
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3; do
            azd provision --no-prompt && exit 0
            [[ "$ATTEMPT" -lt 3 ]] || { echo "::error::azd provision failed after 3 attempts"; exit 1; }
            echo "::warning::azd provision failed (attempt $ATTEMPT/3); a prior ARM operation may still be settling -- retrying in 60s"
            sleep 60
          done

      - name: Deploy evaluated source to production
        id: deploy
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: |
          set -euo pipefail
          azd deploy --no-prompt
          azd ai agent show "$AGENT_NAME" --output json > /tmp/prod-agent-show.json
          AGENT_VERSION=$(jq -er '.version | select(type == "string" and test("^[0-9]+$"))' /tmp/prod-agent-show.json)
          jq -e '.status == "active"' /tmp/prod-agent-show.json
          echo "agent_version=$AGENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload production version evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-version-evidence
          path: /tmp/prod-agent-show*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Production promotion summary
        if: always() && steps.deploy.outcome == 'success'
        env:
          PREVIOUS_VERSION: ${{ needs.deploy-staging.outputs.agent_version }}
          NEW_VERSION: ${{ steps.deploy.outputs.agent_version }}
        run: echo "## Promoted $PREVIOUS_VERSION -> $NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment links summary
        if: always() && steps.deploy.outcome == 'success'
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: python scripts/deployment_summary.py --out ${{ github.workspace }}/deployment-links.md

      # publish-test-trends.yml (triggered by workflow_run) has no azd/Azure
      # context of its own, so it cannot re-derive these links -- it
      # downloads this artifact instead of guessing or omitting them.
      - name: Upload deployment links for the wiki-publish job
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: deployment-links-production
          path: deployment-links.md
          retention-days: 14
          if-no-files-found: warn
