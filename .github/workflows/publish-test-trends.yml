name: Publish Test Trends

# Adapted from the sibling repository's publish-test-trends.yml. Verifies
# the triggering run's provenance, downloads this repository's two real
# evidence-artifact kinds (offline-test-evidence, evaluation-evidence --
# there is no load-test-evidence kind here; this repository has no
# load-test harness), runs the ported scripts/ci_results.py trend
# aggregator, uploads the generated ci-report/ as an artifact regardless of
# the wiki-push outcome, and -- when secrets.WIKI_PUSH_TOKEN is configured
# -- clones this repository's wiki, regenerates Continuous-Test-Trends.md
# and trend-history/, and pushes the result using the same
# `git -c http.extraheader` basic-auth pattern the sibling repository
# uses. If WIKI_PUSH_TOKEN is not configured, the wiki-push step fails
# loudly (::error:: annotation, $GITHUB_STEP_SUMMARY message, exit 1)
# rather than silently skipping. There is also no equivalent of the
# sibling's web-chat-build.yml in the trigger list below: `apps/web-chat`
# exists in this repository, but it is authored/code-only and gated behind
# G2/G3/G6 sign-off (see infra/README.md), so its build workflow does not
# trigger a wiki publish here.
#
# This job has no `azd`/Azure login context of its own, so it cannot
# re-derive real deployment links -- it downloads the `deployment-links-*`
# artifact that `deploy-and-evaluate.yml` uploads from a job that DID have
# that context (preferring `-production`, the most recently promoted
# environment, over `-staging`), and republishes that file's content
# verbatim instead of guessing or omitting the links.

on:
  workflow_run:
    workflows: [Continuous Validation, 'Deploy and Evaluate (Staging -> Production)', Hosted Agent CI/CD]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed main-branch source run ID to publish or repair
        required: true
      run_attempt:
        description: Specific run attempt to publish (defaults to the run's latest attempt)
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: desjardins-quote-preparation-test-trends
  queue: max

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve source run attempt
        if: ${{ env.SOURCE_ATTEMPT == '' }}
        run: |
          set -euo pipefail
          ATTEMPT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.run_attempt')
          echo "SOURCE_ATTEMPT=$ATTEMPT" >> "$GITHUB_ENV"

      - name: Verify source run provenance
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT" > source-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.repository.full_name == $repo' source-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.head_repository.full_name == $repo' source-run.json
          jq -e '.head_branch == "main"' source-run.json
          jq -e '.status == "completed"' source-run.json
          jq -e '.event == "push" or .event == "workflow_dispatch"' source-run.json
          jq -e '
            .path == ".github/workflows/continuous-validation.yml" or
            .path == ".github/workflows/deploy-and-evaluate.yml" or
            .path == ".github/workflows/hosted-agent-cd.yml"
          ' source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT/jobs?per_page=100" > source-jobs.json

      - name: Download known evidence artifacts from the source run
        run: |
          set -euo pipefail
          mkdir -p evidence
          for KIND in offline-test-evidence evaluation-evidence; do
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "${KIND}-${SOURCE_ATTEMPT}" --dir "evidence/$KIND" || true
          done

      - name: Generate CI report
        id: report
        run: python scripts/ci_results.py --evidence evidence --run source-run.json --jobs source-jobs.json --output ci-report

      - name: Retain generated CI report
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ci-report-${{ env.SOURCE_RUN }}-${{ env.SOURCE_ATTEMPT }}
          path: ci-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Download deployment links from the source run
        if: always()
        run: |
          set -euo pipefail
          mkdir -p deployment-links
          for KIND in deployment-links-production deployment-links-staging; do
            if gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$KIND" --dir deployment-links; then
              break
            fi
          done
          find deployment-links -maxdepth 1 -type f

      - name: Deployment links summary
        if: always()
        run: |
          if [ -f deployment-links/deployment-links.md ]; then
            cat deployment-links/deployment-links.md >> "$GITHUB_STEP_SUMMARY"
          else
            python scripts/deployment_summary.py
          fi

      - name: Push trend history to the wiki
        if: always() && steps.report.outcome == 'success'
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WIKI_PUSH_TOKEN:-}" ]; then
            echo "::error::WIKI_PUSH_TOKEN secret is not configured; cannot publish Continuous-Test-Trends.md to the wiki."
            {
              echo '## Wiki publish skipped'
              echo ''
              echo '`WIKI_PUSH_TOKEN` is not configured for this repository, so the generated'
              echo '`ci-report/` (uploaded as an artifact above) could not be published to the'
              echo 'wiki. Provision the secret with wiki write access to enable publishing.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" \
            clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.wiki.git" wiki
          python scripts/ci_results.py --evidence evidence --run source-run.json --jobs source-jobs.json --output ci-report --wiki wiki
          if [ -f deployment-links/deployment-links.md ]; then
            python scripts/update_wiki_deployment_links.py wiki/Home.md --from-file deployment-links/deployment-links.md
          else
            python scripts/update_wiki_deployment_links.py wiki/Home.md
          fi
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish for this run."
          else
            git commit -m "Publish continuous test trends for run ${SOURCE_RUN} attempt ${SOURCE_ATTEMPT}"
            git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push origin master
            {
              echo '## Continuous Test Trends published'
              echo ''
              echo "https://github.com/$GITHUB_REPOSITORY/wiki/Continuous-Test-Trends"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
