name: Continuous Validation

# Offline-only regression suite for the Desjardins quote-preparation
# workshop. No Azure credentials are used anywhere in this file: every step
# is a local pytest sweep, the deterministic evaluation gate, or an offline
# `az bicep build` lint/compile check. This is intentional so the workflow
# is safe to run automatically on every push and pull request while Gates
# G2, G3, and G6 remain open -- staging evaluation against a real
# deployment lives in the separate, `workflow_dispatch`-only
# deploy-and-evaluate.yml, not here (see that file's gating comment).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r mcp/application-server/requirements.txt \
            -r mcp/rulebook-server/requirements.txt \
            -r src/quote-preparation-agent/requirements.txt
          mkdir -p evidence

      - name: Agent graph unit tests
        run: |
          pytest src/quote-preparation-agent/tests -v --junitxml=evidence/agent.xml

      - name: Deterministic evaluation checks
        run: |
          pytest eval -v --junitxml=evidence/deterministic.xml

      - name: Reporting and contract tests
        run: |
          pytest apps/workshop/tests mcp/application-server/tests mcp/rulebook-server/tests \
            -v --junitxml=evidence/reporting.xml

      - name: Deterministic evaluation gate (golden dataset)
        if: ${{ !cancelled() }}
        run: python eval/evaluation_gate.py

      - name: Deterministic evaluation gate summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("eval/results.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not path.exists():
              lines = [
                  "## Deterministic Evaluation Gate",
                  "",
                  "No eval/results.json was produced; inspect the gate step above.",
                  "",
              ]
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              records = report["records"]
              passed = sum(1 for record in records if record["passed"])
              lines = [
                  "## Deterministic Evaluation Gate",
                  "",
                  f"Dataset size: {report['dataset_size']}",
                  f"Passed records: {passed} / {len(records)}",
                  f"Bilingual parity: {report['bilingual_parity']['passed']}",
                  f"Gate result: {'PASSED' if report['passed'] else 'FAILED'}",
                  "",
              ]
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          PY

      - name: Offline test summary
        if: always()
        run: python scripts/ci_results.py --junit evidence

      - name: Stage deterministic gate result alongside JUnit evidence
        if: always()
        run: cp -f eval/results.json evidence/results.json 2>/dev/null || true

      - name: Retain offline test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-test-evidence-${{ github.run_attempt }}
          path: |
            evidence/*.xml
            evidence/results.json
          retention-days: 30
          if-no-files-found: warn

  bicep-lint:
    name: Bicep lint and compile (offline; no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: az bicep install
        run: az bicep install

      - name: az bicep build (main template and every module; compile-only, no login, no apply)
        id: bicep-build
        run: |
          set -euo pipefail
          for FILE in infra/main.bicep infra/modules/*.bicep; do
            echo "::group::az bicep build $FILE"
            az bicep build --file "$FILE"
            echo "::endgroup::"
          done

      - name: Bicep lint summary
        if: always()
        run: |
          {
            echo '## Bicep Lint'
            echo ''
            echo 'Templates compiled with `az bicep build` (compile-only; no login, no apply):'
            echo ''
            for FILE in infra/main.bicep infra/modules/*.bicep; do
              echo "- \`$FILE\`"
            done
            echo ''
            if [ "${{ steps.bicep-build.outcome }}" = "success" ]; then
              echo 'Zero diagnostics reported by `az bicep build` for every template listed above.'
            else
              echo '`az bicep build` reported diagnostics or failed; see the step above for details.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
